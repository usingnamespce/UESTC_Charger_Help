<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>电子科技大学充电桩查询</title>
<style>
  :root {
    --bg-top: #070a0e;
    --bg-bottom: #12161c;
    --card: #181818;
    --card-hi: #212327;
    --border: rgba(255, 255, 255, .12);
    --text: #f6f6f8;
    --muted: #8999ac;
    --green: #30d158;
    --red: #ff453a;
    --yellow: #ffd60a;
    --blue: #0a84ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45;
    min-height: 100vh;
  }
  body { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px; }

  /* 顶栏 */
  header {
    position: sticky; top: 0; z-index: 10;
    padding: 12px 0 8px;
    background: linear-gradient(180deg, rgba(7,10,14,.96), rgba(7,10,14,.82));
    backdrop-filter: saturate(180%) blur(10px);
  }
  .top { display: flex; align-items: center; gap: 10px; }
  .back {
    display: none; width: 34px; height: 34px; flex: 0 0 auto;
    border-radius: 50%; border: 1px solid var(--border);
    background: var(--card-hi); color: var(--text);
    font-size: 18px; cursor: pointer; line-height: 1;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 700; flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .toolbar { display: flex; gap: 8px; margin-top: 8px; }
  .search {
    flex: 1 1 auto; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card-hi);
    color: var(--text); font-size: 14px; outline: none;
  }
  .search::placeholder { color: var(--muted); }
  .toolbar .search { min-width: 0; }
  .btn {
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-hi); color: var(--text); font-size: 13px; cursor: pointer;
    flex: 0 0 auto; white-space: nowrap;
  }
  .btn:active { transform: scale(.96); }

  /* 汇总条 */
  .stats { display: flex; gap: 8px; margin: 12px 0 4px; }
  .stat {
    flex: 1 1 0; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 8px 10px; text-align: center;
    position: relative; overflow: hidden;
  }
  .stat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; opacity: .85; }
  .stat.free::before { background: var(--green); }
  .stat.busy::before { background: var(--yellow); }
  .stat.broken::before { background: var(--red); }
  .stat .n { font-size: 25px; font-weight: 800; letter-spacing: -.5px; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stat.free .n { color: var(--green); }
  .stat.busy .n { color: var(--yellow); }
  .stat.broken .n { color: var(--red); }

  /* 卡片列表 */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .station-groups { gap: 20px; }
  .station-group-title {
    margin: 0 0 8px; padding: 8px 0; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 14px; font-weight: 700; overflow-wrap: anywhere;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; cursor: pointer; transition: all .12s;
  }
  .card:active { background: var(--card-hi); transform: scale(.992); }
  .card .name { flex: 1 1 auto; font-weight: 600; font-size: 15px; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* 插座网格 */
  .outlet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .outlet {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); padding: 10px 8px; text-align: center;
  }
  .outlet .no { font-size: 17px; font-weight: 700; }
  .outlet .st { font-size: 12px; margin-top: 3px; }
  .outlet.free .no { color: var(--green); }
  .outlet.busy .no { color: var(--yellow); }
  .outlet.broken .no { color: var(--red); }
  .outlet .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .seg { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: rgba(30,32,36,.95); color: var(--text); padding: 10px 16px;
    border-radius: 10px; border: 1px solid var(--border); font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99;
  }
  .toast.show { opacity: 1; }

  /* 地点筛选 */
  .place-picker { margin: 8px 0; }
  .place-picker > summary {
    display: flex; align-items: center; justify-content: space-between; min-height: 44px; list-style: none;
  }
  .place-picker > summary::-webkit-details-marker { display: none; }
  .place-picker > summary::after { content: "+"; color: var(--muted); font-size: 18px; }
  .place-picker[open] > summary::after { content: "−"; }
  .place-panel {
    padding: 8px; margin-top: 6px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .place-tools { display: flex; gap: 8px; margin-bottom: 6px; }
  .place-tools .search { min-width: 0; }
  .place-tools button:disabled { color: var(--muted); cursor: default; }
  .place-options { max-height: min(40vh, 300px); overflow-y: auto; overscroll-behavior: contain; }
  .place-option {
    display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 8px;
    border-bottom: 1px solid var(--border); font-size: 14px; cursor: pointer; overflow-wrap: anywhere;
  }
  .place-option:last-child { border-bottom: 0; }
  .place-option input { flex: 0 0 auto; width: 18px; height: 18px; margin: 0; accent-color: var(--blue); }
  .place-message { margin: 8px; font-size: 13px; color: var(--muted); }

  /* 列表快速筛选 */
  .filter { display: flex; gap: 6px; margin: 8px 0; }
  .fbtn { border: 1px solid var(--border); background: var(--card-hi); color: var(--muted);
    padding: 9px 0; border-radius: 999px; font-size: 13px; cursor: pointer; flex: 1 1 0;
    transition: all .12s;
    display: flex; align-items: center; justify-content: center; gap: 4px; }
  .fbtn b { font-size: 12px; opacity: .8; font-weight: 600; }
  .fbtn:active { transform: scale(.96); }
  .fbtn.on { background: var(--blue); color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 2px 8px rgba(10,132,255,.4); }
  .fbtn.free.on { background: var(--green); color: #043; box-shadow: 0 2px 8px rgba(48,209,88,.35); }

  /* 卡片三个状态胶囊 */
  .card .card-top { display: flex; align-items: center; gap: 8px; }
  .card .name { flex: 1 1 auto; font-weight: 600; font-size: 15px; }
  .card .total { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pills { display: flex; gap: 6px; margin-top: 8px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); }
  .pill.f { color: var(--green); }
  .pill.b { color: var(--yellow); }
  .pill.k { color: var(--red); }
  .pill.hl { font-weight: 700; border-width: 2px; }

  /* 自动刷新开关 */
  .switch { border: 1px solid var(--border); background: var(--card-hi); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .switch.on { background: var(--green); color: #043; border-color: transparent; font-weight: 600; }
  .refresh { display: inline-flex; align-items: center; gap: 5px; }
  .refresh.spin svg { animation: rot 0.9s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* 页脚提示 */
  .updated { color: var(--muted); font-size: 12px; margin: 6px 0 2px; }
  /* 静态地图 */
  .map-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .map-header .seg { margin: 0; }
  .map-note { color: var(--muted); margin: 4px 0 10px; font-size: 13px; }
  .map-image { display: block; width: 100%; height: auto; border-radius: var(--radius); }
  .map-original { text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <button class="back" id="backBtn" onclick="goBack()">‹</button>
      <h1><span class="dot" id="healthDot"></span>电子科技大学充电桩查询</h1>
      <button class="btn refresh" id="refreshBtn" onclick="refresh()">
        <svg class="ri" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>刷新
      </button>
    </div>
    <div class="toolbar">
      <input class="search" id="searchInput" placeholder="搜索站点…" aria-label="搜索已选地点的站点" oninput="applyStationFilter()">
      <button class="btn" id="mapBtn" type="button" onclick="openMap()">地图</button>
      <button class="switch" id="autoBtn" onclick="toggleAuto()">自动刷新</button>
    </div>
  </header>

  <!-- 站点列表 -->
  <section id="view-stations">
    <details class="place-picker" id="placePicker">
      <summary class="btn"><span id="placePickerText">选择地点</span></summary>
      <div class="place-panel">
        <div class="place-tools">
          <input class="search" id="placeSearch" type="search" placeholder="搜索地点…" aria-label="搜索地点"
            autocomplete="off" oninput="renderPlaceOptions()">
          <button class="btn" id="selectAllPlacesBtn" type="button" onclick="selectAllPlaces()" disabled>全选</button>
          <button class="btn" id="clearPlacesBtn" type="button" onclick="clearPlaces()" disabled>清空已选</button>
        </div>
        <div class="place-options" id="placeOptions" onchange="setPlaceSelected(event.target.value, event.target.checked)"></div>
      </div>
    </details>
    <div class="stats" id="statsBar"></div>
    <div class="updated" id="updatedAt"></div>
    <div class="filter" id="stationFilter">
      <button class="fbtn" data-f="all" onclick="setStationFilter('all')">全部 <b id="cnt-all"></b></button>
      <button class="fbtn free on" data-f="free" onclick="setStationFilter('free')">空闲 <b id="cnt-free"></b></button>
    </div>
    <div class="list station-groups" id="stationList">
      <div class="empty">正在加载站点…</div>
    </div>
  </section>

  <!-- 静态地图 -->
  <section id="view-map" style="display:none" aria-labelledby="mapTitle">
    <div class="map-header">
      <h2 class="seg" id="mapTitle">充电桩分布图</h2>
      <a class="btn map-original" id="mapOriginal" href="charger-map.jpg" target="_blank" rel="noopener">查看原图</a>
    </div>
    <p class="map-note">图片仅供位置参考，充电口状态以列表为准。</p>
    <img class="map-image" id="mapImage" alt="电子科技大学清水河校区充电桩分布图"
      width="4106" height="5000" decoding="async">
  </section>

  <!-- 插座列表 -->
  <section id="view-outlets" style="display:none">
    <div class="seg" id="outletTitle"></div>
    <p class="updated" id="outletNote" role="status"></p>
    <div class="outlet-grid" id="outletGrid"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- 状态 ---------- */
const PLACES_STORAGE_KEY = "charger-monitor.selected-places";
const S = {
  stationGroups: [],
  selectedPlaces: readSelectedPlaces(), // null 表示选择全部地点，包括后来新增的地点。
  currentStation: null,
  stationFilter: "free",
  stack: [],
  auto: false,
  timer: null,
  initialTimer: null,
  health: null,
};

const $ = id => document.getElementById(id);
const STATUS_OUTLET = {1:"空闲", 2:"充电中", 3:"故障"};
const CLS_OUTLET = {1:"free", 2:"busy", 3:"broken"};

/* ---------- 工具 ---------- */
async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (j && j.ok !== true) throw new Error(j.error || "接口返回异常");
  return j.data;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function fmtTime(v) {
  if (!v) return "-";
  const d = new Date(v);
  if (isNaN(d)) return "-";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(v) {
  if (v == null) return "-";
  const m = Math.max(0, Math.round(v));
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? `${h}h ${String(mm).padStart(2,"0")}m` : `${m} min`;
}

/* ---------- 视图切换 ---------- */
const VIEWS = ["view-stations", "view-outlets", "view-map"];
function showView(name, push) {
  VIEWS.forEach(v => $(v).style.display = v === name ? "block" : "none");
  $("searchInput").style.display = name === "view-stations" ? "block" : "none";
  $("mapBtn").hidden = name !== "view-stations";
  $("backBtn").style.display = push ? "inline-block" : "none";
  window.scrollTo(0, 0);
}
function goBack() {
  const prev = S.stack.pop();
  if (prev) showView(prev.view, S.stack.length > 0);
  else showView("view-stations", false);
}
function nav(view, pushFn) {
  S.stack.push({ view: currentView() });
  showView(view, true);
  return pushFn?.();
}
function currentView() {
  return VIEWS.find(v => $(v).style.display !== "none") || "view-stations";
}

function openMap() {
  const image = $("mapImage");
  if (!image.hasAttribute("src") || (image.complete && !image.naturalWidth)) {
    image.src = $("mapOriginal").href;
  }
  nav("view-map");
}

/* ---------- 健康检查 ---------- */
async function checkHealth() {
  try {
    const h = await api("/api/health");
    S.health = h;
    const totals = h.totals;
    $("healthDot").className = "dot" + (totals.failed_station_count ? " err" : totals.ready_station_count ? " ok" : "");
    return true;
  } catch (e) {
    $("healthDot").className = "dot err";
    return false;
  }
}

/* ---------- 站点 ---------- */
const stationNameOrder = new Intl.Collator("zh-CN-u-co-pinyin", { numeric: true });
const UNCLASSIFIED_PLACE = "未分类";
let stationKeywordsRequest;

function normalizePlaceName(name) {
  return name.normalize("NFKC").replace(/\s+/g, "").toLowerCase();
}

function parsePlaceKeywords(text) {
  const keywords = new Map();
  for (const line of text.split(/\r?\n/)) {
    const label = line.trim();
    const key = normalizePlaceName(label);
    if (key && !keywords.has(key)) keywords.set(key, label);
  }
  // 重叠时优先匹配更具体的关键词；同长度保留配置文件中的顺序。
  return [...keywords].sort(([a], [b]) => b.length - a.length);
}

function matchingPlaceName(stationName, keywords) {
  const name = normalizePlaceName(stationName);
  return keywords.find(([key]) => name.includes(key))?.[1];
}

function loadStationKeywords() {
  if (!stationKeywordsRequest) {
    stationKeywordsRequest = fetch("station_keywords.txt").then(async res => {
      if (!res.ok) throw new Error(`无法读取地点关键词（HTTP ${res.status}）`);
      const keywords = parsePlaceKeywords(await res.text());
      if (!keywords.length) throw new Error("地点关键词清单为空");
      // 用关键词归并浏览器中仍保存着的旧分组名。
      if (S.selectedPlaces !== null) {
        S.selectedPlaces = new Set([...S.selectedPlaces].map(name => matchingPlaceName(name, keywords) || name));
      }
      return keywords;
    }).catch(error => {
      stationKeywordsRequest = null;
      throw error;
    });
  }
  return stationKeywordsRequest;
}

function groupStations(stations, keywords) {
  const groups = new Map();
  for (const station of stations) {
    const name = matchingPlaceName(station.station_name, keywords) || UNCLASSIFIED_PLACE;
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(station);
  }
  return [...groups.entries()]
    .sort(([a], [b]) => stationNameOrder.compare(a, b) || (a < b ? -1 : a > b ? 1 : 0))
    .map(([name, members]) => [name, members.sort((a, b) =>
      stationNameOrder.compare(a.station_name, b.station_name) || a.station_id - b.station_id)]);
}

function readSelectedPlaces() {
  try {
    const saved = JSON.parse(localStorage.getItem(PLACES_STORAGE_KEY));
    return Array.isArray(saved) ? new Set(saved.filter(name => typeof name === "string")) : null;
  } catch {
    return null;
  }
}

function isPlaceSelected(name) {
  return S.selectedPlaces === null || S.selectedPlaces.has(name);
}

function renderPlaceOptions() {
  const q = $("placeSearch").value.trim().toLowerCase();
  const names = S.stationGroups.map(([name]) => name).filter(name => name.toLowerCase().includes(q));
  $("placeOptions").innerHTML = names.map(name => `
    <label class="place-option">
      <input type="checkbox" value="${esc(name)}"${isPlaceSelected(name) ? " checked" : ""}>
      <span>${esc(name)}</span>
    </label>`).join("") || `<p class="place-message">${q ? "没有匹配的地点" : "暂无地点数据"}</p>`;
}

function updatePlacePicker() {
  const total = S.stationGroups.length;
  const count = S.stationGroups.filter(([name]) => isPlaceSelected(name)).length;
  $("placePickerText").textContent = count === 0 ? "选择地点" :
    count === total ? "选择地点（全部）" : `选择地点（已选 ${count}）`;
  $("selectAllPlacesBtn").disabled = !total || S.selectedPlaces === null;
  $("clearPlacesBtn").disabled = !count;
}

function saveSelectedPlaces() {
  try {
    if (S.selectedPlaces === null) localStorage.removeItem(PLACES_STORAGE_KEY);
    else localStorage.setItem(PLACES_STORAGE_KEY, JSON.stringify([...S.selectedPlaces]));
  } catch {
    // 浏览器禁用本地存储时，当前页面仍可使用筛选。
  }
  updatePlacePicker();
  applyStationFilter();
}

function setPlaceSelected(name, checked) {
  if (S.selectedPlaces === null) S.selectedPlaces = new Set(S.stationGroups.map(([name]) => name));
  if (checked) S.selectedPlaces.add(name);
  else S.selectedPlaces.delete(name);
  saveSelectedPlaces();
}

function selectAllPlaces() {
  S.selectedPlaces = null;
  renderPlaceOptions();
  saveSelectedPlaces();
}

function clearPlaces() {
  S.selectedPlaces = new Set();
  renderPlaceOptions();
  saveSelectedPlaces();
}

function showStationLoadError(error) {
  $("stationList").innerHTML = '<div class="empty">站点加载失败，请刷新重试</div>';
  toast("站点加载失败：" + error.message);
}

async function loadStations() {
  const [stations, keywords] = await Promise.all([api("/api/stations"), loadStationKeywords()]);
  const groups = groupStations(stations, keywords);
  const namesChanged = groups.length !== S.stationGroups.length ||
    groups.some(([name], i) => name !== S.stationGroups[i][0]);
  S.stationGroups = groups;
  // 定时刷新状态时不替换地点选项，以保留面板的焦点和滚动位置。
  if (namesChanged || !$("placeOptions").firstElementChild) renderPlaceOptions();
  updatePlacePicker();
  applyStationFilter();
  scheduleInitialRefresh(stations);
}

function scheduleInitialRefresh(stations) {
  clearTimeout(S.initialTimer);
  S.initialTimer = null;
  if (!stations.length || stations.some(s => s.sample_status === "ready") || S.health?.collector?.auto_collect === false) return;
  // 首次成功前自动检查本地快照，不触发上游采样。
  S.initialTimer = setTimeout(async () => {
    await checkHealth();
    await loadStations().catch(showStationLoadError);
    if (currentView() === "view-outlets") await loadOutlets();
  }, 10000);
}

function stationPasses(s, filter) {
  if (filter === "all") return true;
  return s.sample_status === "ready" && s.free_count > 0;
}

function applyStationFilter() {
  const q = $("searchInput").value.trim().toLowerCase();
  const selected = S.stationGroups.filter(([name]) => isPlaceSelected(name));
  const matches = selected.map(([name, members]) => [name,
    members.filter(station => station.station_name.toLowerCase().includes(q))]);
  const stations = matches.flatMap(([, members]) => members);
  const ready = stations.filter(s => s.sample_status === "ready");
  $("cnt-all").textContent = stations.length;
  $("cnt-free").textContent = ready.length ? ready.filter(s => stationPasses(s, "free")).length : "–";
  renderStats(ready);
  renderSampleStatus(stations, ready);

  const shown = matches.map(([name, members]) => [name,
    members.filter(s => stationPasses(s, S.stationFilter))]).filter(([, members]) => members.length);
  renderStations(shown, emptyStationMessage(stations, ready, selected.length > 0));
}

function renderSampleStatus(stations, ready) {
  const latest = ready.map(s => s.last_seen_at).sort().pop();
  const failures = stations.filter(s => s.sample_status === "stale" || s.sample_status === "unavailable").length;
  const messages = [];
  if (latest) messages.push(`最近采样：${fmtTime(latest)}`);
  if (failures) messages.push(`${failures} 个站点采样失败，可在「全部」中查看`);
  $("updatedAt").textContent = messages.join(" · ");
}

function emptyStationMessage(stations, ready, hasSelection) {
  if (!S.stationGroups.length) return "采样清单暂无站点";
  if (!hasSelection) return "请选择要查看的地点";
  if (stations.length && !ready.length) {
    if (stations.every(s => s.sample_status === "waiting")) {
      return S.health?.collector?.auto_collect === false ? "未开启自动采样，暂无数据" : "正在等待首次采样…";
    }
    return "所选站点暂无可用采样数据，请稍后刷新";
  }
  return "没有匹配的站点";
}

function setStationFilter(f) {
  S.stationFilter = f;
  document.querySelectorAll("#stationFilter .fbtn").forEach(b =>
    b.classList.toggle("on", b.dataset.f === f));
  applyStationFilter();
}

function renderStats(stations) {
  const count = key => stations.length ? stations.reduce((total, s) => total + s[key], 0) : "–";
  $("statsBar").innerHTML = `
    <div class="stat free"><div class="n">${count("free_count")}</div><div class="l">空闲</div></div>
    <div class="stat busy"><div class="n">${count("busy_count")}</div><div class="l">充电中</div></div>
    <div class="stat broken"><div class="n">${count("broken_count")}</div><div class="l">故障</div></div>`;
}

function renderStations(groups, emptyMessage) {
  const box = $("stationList");
  if (!groups.length) {
    box.innerHTML = `<div class="empty">${esc(emptyMessage)}</div>`;
    return;
  }
  box.innerHTML = groups.map(([name, members]) => `
    <section class="station-group">
      <h2 class="station-group-title">${esc(name)}</h2>
      <div class="list">${members.map(renderStationCard).join("")}</div>
    </section>`).join("");
}

function stationStatusText(station) {
  if (station.sample_status === "ready") return `采样时间：${fmtTime(station.last_seen_at)}`;
  if (station.sample_status === "stale") return `采样失败 · 上次成功：${fmtTime(station.last_seen_at)}`;
  if (station.sample_status === "unavailable") return "采样失败，暂无可靠状态";
  return S.health?.collector?.auto_collect === false ? "未开启自动采样，暂无数据" : "正在等待首次采样…";
}

function renderStationCard(s) {
  const ready = s.sample_status === "ready";
  return `
    <div class="card" onclick="openOutlets(${s.station_id}, ${esc(JSON.stringify(s.station_name))})">
      <div class="card-top">
        <div class="name">${esc(s.station_name)}</div>
        ${ready ? `<div class="total">共 ${s.outlet_count} 插座</div>` : ""}
      </div>
      ${ready ? `<div class="pills">
        <span class="pill f ${S.stationFilter === "free" ? "hl" : ""}">空闲 ${s.free_count}</span>
        <span class="pill b">充电中 ${s.busy_count}</span>
        <span class="pill k ${s.broken_count ? "hl" : ""}">故障 ${s.broken_count}</span>
      </div>` : `<div class="sub">${esc(stationStatusText(s))}</div>`}
    </div>`;
}

/* ---------- 插座 ---------- */
function openOutlets(sid, name) {
  S.currentStation = { id: sid, name };
  $("outletTitle").textContent = name;
  $("outletNote").textContent = "正在读取充电口状态…";
  $("outletGrid").innerHTML = "";
  return nav("view-outlets", loadOutlets);
}

async function loadOutlets() {
  const station = S.currentStation;
  try {
    const data = await api("/api/outlets?station_id=" + station.id);
    if (S.currentStation !== station) return;
    $("outletNote").textContent = stationStatusText(data);
    if (data.sample_status === "ready" && !data.outlets.length) {
      $("outletNote").textContent += " · 暂无充电口";
    }
    $("outletGrid").innerHTML = data.outlets.map(o => {
      const cls = CLS_OUTLET[o.status] || "broken";
      let meta = "";
      if (o.status === 2) {
        meta = `<div class="meta">${o.used_min == null ? "时长未知" : "已充 " + fmtDur(o.used_min)}</div>`;
      } else if (o.status === 1) {
        meta = '<div class="meta">可用</div>';
      }
      return `
        <div class="outlet ${cls}">
          <div class="no">${o.serial}</div>
          <div class="st">${STATUS_OUTLET[o.status] || "未知"}</div>
          ${meta}
        </div>`;
    }).join("");
  } catch (e) {
    if (S.currentStation !== station) return;
    $("outletNote").textContent = "充电口状态读取失败，请刷新重试";
    $("outletGrid").innerHTML = "";
    toast("插座加载失败: " + e.message);
  }
}

/* ---------- 刷新 / 自动 ---------- */
async function refresh() {
  const btn = $("refreshBtn");
  btn.classList.add("spin");
  const view = currentView();
  try {
    await checkHealth();
    if (view === "view-stations") await loadStations();
    else if (view === "view-outlets") await loadOutlets();
  } catch (e) {
    if (view === "view-stations") showStationLoadError(e);
    else toast("刷新失败: " + e.message);
  } finally {
    setTimeout(() => btn.classList.remove("spin"), 600);
  }
}
function toggleAuto() {
  S.auto = !S.auto;
  const b = $("autoBtn");
  b.textContent = S.auto ? "自动刷新 ✓" : "自动刷新";
  b.classList.toggle("on", S.auto);
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  if (S.auto) {
    S.timer = setInterval(() => { const v = currentView(); if (v === "view-stations" || v === "view-outlets") refresh(); }, 30000);
    toast("已开启 30 秒自动刷新");
  }
}
/* ---------- 启动 ---------- */
(async function boot() {
  const ok = await checkHealth();
  if (!ok) toast("后端不可达，请确认服务已启动");
  await loadStations().catch(showStationLoadError);
})();
</script>
</body>
</html>
